<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker Pro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Expense Tracker <span class="pro">Pro</span></h1>

    <div id="banner" class="banner" role="alert" hidden></div>

    <!-- Add / edit form -->
    <form id="expense-form" novalidate>
      <h2 id="form-title">Add an expense</h2>
      <div class="grid">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Lunch" maxlength="100" autocomplete="off">
          <span class="error" id="err-title" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="amount">Amount (Rs.)</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" inputmode="decimal">
          <span class="error" id="err-amount" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category"></select>
          <span class="error" id="err-category" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" min="2000-01-01">
          <span class="error" id="err-date" aria-live="polite"></span>
        </div>
      </div>
      <div class="actions">
        <button type="submit" id="submit-btn" class="primary">Add Expense</button>
        <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
      </div>
    </form>

    <!-- Summary -->
    <section class="summary" aria-label="Summary">
      <h2>Total Spent: Rs. <span id="total">0.00</span></h2>
      <div class="stats">
        <div><span class="stat-label">Expenses</span><strong id="count">0</strong></div>
        <div><span class="stat-label">Average</span><strong id="average">0.00</strong></div>
        <div><span class="stat-label">Highest</span><strong id="highest">-</strong></div>
      </div>
      <ul id="category-bars" class="bars"></ul>
    </section>

    <!-- Filters -->
    <section class="filters" aria-label="Filters">
      <div class="field">
        <label for="filter-category">Show category</label>
        <select id="filter-category"><option value="">All categories</option></select>
      </div>
      <div class="field">
        <label for="filter-month">Month</label>
        <input type="month" id="filter-month">
      </div>
      <button type="button" id="clear-filters" class="secondary">Clear filters</button>
      <a id="export-link" class="button-link" href="/api/export.csv" download="expenses.csv">Export CSV</a>
    </section>

    <!-- List -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Title</th><th>Amount</th><th>Category</th><th>Date</th><th>Action</th></tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>No expenses to show.</p>

    <p class="version">Version 2.0</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
